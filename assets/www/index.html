<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark" />
    <title>MAX Mini App</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>
<div id="page">
    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div class="loaderText" data-i18n="loading">Загрузка…</div>
    </div>

    <div class="content">
        <div id="app" class="hidden">
            <div id="app-content"></div>
            <div id="app-menu">
                <nav>
                    <button class="menuBtn active" data-page="list">Библиотеки</button>
                    <button class="menuBtn" data-page="turnstile">Турникет</button>
                    <button class="menuBtn" data-page="qr">Мой ID</button>
                </nav>
            </div>
            <div id="library-container"></div>
            <div id="alert-container"></div>
        </div>
        <div id="app-error" class="hidden">
            <div class="title" data-i18n="webapp_error_title">Техническая заминка</div>
            <div class="message" data-i18n="webapp_error_message">Подождите и попробуйте ещё раз</div>
        </div>
    </div>

    <div id="MainButton" style="display:none;">
        <button class="bottom-button"></button>
    </div>
</div>

<script src="js/bridge.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/code128.js"></script>
<script src="js/app.js"></script>
</body>
</html>
